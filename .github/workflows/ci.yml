name: amazon_actions_ci.yml

on:
    push:
        branches:
            - feature
    pull_request:
        branches:
            - main
            - feature

jobs:
    job1:
        runs-on: ubuntu-24.04

        steps:
           - name: checkout code
           - uses: actions/checkout@v4

           - name: setup node-sdk
           - uses: actions/setup-node@v6

           - name: download dependencies
             run:  npm ci


           

           